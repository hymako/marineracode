<!doctype html>
<html lang="es">

<head>
  <!-- Google tag (gtag.js) + Consent Mode v2 -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }

    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'analytics_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'wait_for_update': 500
    });

    gtag('set', 'url_passthrough', true);
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RWYJ8T2Q7V"></script>
  <script>
    gtag('js', new Date());
    gtag('config', 'G-RWYJ8T2Q7V', {
      send_page_view: true,
      debug_mode: location.hostname === 'localhost'
    });

    window.addEventListener('hashchange', () => {
      gtag('event', 'page_view', {
        page_location: location.href,
        page_title: document.title
      });
    });
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarineraCode — Portfolio</title>
  <meta name="description" content="Desarrollo web y apps: landings, e-commerce, blog, eventos e inmobiliaria." />

  <!-- Favicon / PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="/logo-512.png" />

  <link rel="apple-touch-icon" href="/logo-512.png" />

  <!-- Open Graph -->

  <script type="module" crossorigin src="/assets/index-DsvwnprF.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-C3XhZbYW.css">
</head>

<body class="bg-white text-neutral-900">
    <div id="root"></div>
    <div id="cookie-bar" style="
      position:fixed;left:0;right:0;bottom:0;z-index:9999;
      background:#fff; border-top:1px solid #ddd; padding:12px 16px;
      display:flex;gap:12px;justify-content:center;align-items:center;
      box-shadow:0 -6px 20px rgba(0,0,0,.06); font:14px/1.3 system-ui, sans-serif;">
      <span>Usamos cookies analíticas para mejorar tu experiencia.</span>
      <button id="cookie-accept" style="
        background:#6b4a3b;color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer;">
        Aceptar
      </button>
    </div>
    <script>
      (function () {
        const KEY = 'mc_consent';
        const saved = localStorage.getItem(KEY);
        const bar = document.getElementById('cookie-bar');
        if (saved === 'granted') { bar.remove(); return; }

        document.getElementById('cookie-accept').addEventListener('click', () => {
          // Actualiza Consent Mode → permite analytics
          gtag('consent', 'update', {
            'analytics_storage': 'granted',
            'ad_storage': 'denied',
            'ad_user_data': 'denied',
            'ad_personalization': 'denied'
          });
          localStorage.setItem(KEY, 'granted');
          bar.remove();
          // dispara un page_view inmediatamente tras el consentimiento
          gtag('event', 'page_view', { page_location: location.href, page_title: document.title });
        });
      })();
    </script>
</body>

</html>
